<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LoanApp">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- rising sun -->
  <circle cx="42" cy="21" r="9" fill="url(#sun)"/>

  <!-- back ridge -->
  <polygon points="26,50 41,27 57,50" fill="#6366f1"/>
  <polygon points="41,27 44,50 57,50" fill="#4338ca"/>

  <!-- front peak, folded like paper -->
  <polygon points="7,50 25,17 43,50" fill="url(#peak)"/>
  <polygon points="25,17 29,50 43,50" fill="#a5b4fc"/>
  <polygon points="25,17 21,30 25,27 29,31" fill="#ffffff"/>

  <!-- ground line -->
  <rect x="7" y="50" width="50" height="3" rx="1.5" fill="#fbbf24"/>
</svg>
